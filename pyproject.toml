[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.1.1",
    "zhipuai>=2.0.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "pydantic>=2.0.0",
    "email-validator>=1.1.0,<2.3",
    "fastapi-users[sqlalchemy]==13.0.0",
    "aiosqlite>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
# Pytest configuration for RAG system tests
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output formatting
addopts = [
    "-v",                    # Verbose output
    "--strict-markers",      # Error on unknown markers
    "--tb=short",            # Shorter traceback format
    "--color=yes",           # Colored output
    "-p", "no:warnings",     # Suppress warnings during test runs
]

# Markers for organizing tests
markers = [
    "unit: Unit tests (fast, isolated component tests)",
    "integration: Integration tests (slower, multiple components)",
    "api: API endpoint tests",
    "auth: Authentication and authorization tests",
    "slow: Slow tests (network calls, database operations)",
]

# Asyncio configuration
asyncio_mode = "auto"

# Coverage options (if using pytest-cov)
# addopts = ["--cov=backend", "--cov-report=term-missing"]

# Logging configuration
log_cli = false
log_cli_level = "INFO"
