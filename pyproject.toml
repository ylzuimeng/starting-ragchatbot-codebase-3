[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.1.1",
    "zhipuai>=2.0.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "pydantic>=2.0.0",
    "email-validator>=1.1.0,<2.3",
    "fastapi-users[sqlalchemy]==13.0.0",
    "aiosqlite>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.8.0",
]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | chroma_db
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by black)
    "F401",  # imported but unused (too many false positives)
    "E402",  # module level import not at top of file (intentional in some files)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["F"]  # Less strict for tests
