<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RAG课程助手</title>
    <link rel="stylesheet" href="style.css?v=10">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="logo">
                    <i class="fas fa-robot"></i>
                    <h1>RAG课程助手</h1>
                </div>
                <p class="subtitle">
                    <i class="fas fa-lightbulb"></i>
                    询问课程、讲师和内容相关问题
                </p>
            </div>
            <div class="header-right">
                <button id="themeToggle" class="theme-toggle" aria-label="切换主题" title="切换主题">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-info">
                    <span class="username" id="username"></span>
                    <button id="logoutBtn" class="logout-button">
                        <i class="fas fa-sign-out-alt"></i>
                        登出
                    </button>
                </div>
            </div>
        </header>

        <div class="main-content">
            <!-- Left Sidebar -->
            <aside class="sidebar">
                <!-- New Chat Button -->
                <div class="sidebar-section">
                    <div class="stats-header" onclick="createNewSession()">
                        <i class="fas fa-plus"></i>
                        <span>新建对话</span>
                    </div>
                </div>

                <!-- Course Stats -->
                <div class="sidebar-section">
                    <details class="stats-collapsible">
                        <summary class="stats-header">
                            <i class="fas fa-book"></i>
                            <span>课程列表</span>
                        </summary>
                        <div class="course-stats" id="courseStats">
                            <div class="stat-item stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-graduation-cap"></i>
                                </div>
                                <div class="stat-content">
                                    <span class="stat-label">课程总数</span>
                                    <span class="stat-value" id="totalCourses">-</span>
                                </div>
                            </div>
                            <div class="stat-item">
                                <div class="course-titles" id="courseTitles">
                                    <span class="loading">
                                        <i class="fas fa-spinner fa-spin"></i>
                                        加载中...
                                    </span>
                                </div>
                            </div>
                        </div>
                    </details>
                </div>

                <!-- Suggested Questions -->
                <div class="sidebar-section">
                    <details class="suggested-collapsible" open>
                        <summary class="suggested-header">
                            <i class="fas fa-question-circle"></i>
                            <span>建议问题</span>
                        </summary>
                        <div class="suggested-items">
                            <button class="suggested-item" data-question="MCP课程的提纲是什么？">
                                <i class="fas fa-list"></i>
                                <span>课程提纲</span>
                            </button>
                            <button class="suggested-item" data-question="有哪些课程包含Chatbot实现？">
                                <i class="fas fa-comments"></i>
                                <span>关于Chatbot的课程</span>
                            </button>
                            <button class="suggested-item" data-question="有哪些课程解释了什么是RAG？">
                                <i class="fas fa-search"></i>
                                <span>解释RAG的课程</span>
                            </button>
                            <button class="suggested-item" data-question="MCP课程第5课讲了什么内容？">
                                <i class="fas fa-book-open"></i>
                                <span>课程具体内容</span>
                            </button>
                        </div>
                    </details>
                </div>
            </aside>

            <!-- Main Chat Area -->
            <main class="chat-main">
                <div class="chat-container">
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="chat-input-container">
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="chatInput"
                                placeholder="输入您的问题..."
                                autocomplete="off"
                            >
                            <button id="sendButton" class="send-button">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js?v=10"></script>
</body>
</html>
